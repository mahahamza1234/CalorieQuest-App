services:
  - name: frontend
    build_command: pnpm install && pnpm run build
    start_command: pnpm preview --host 0.0.0.0
    port: 3000
    type: web
    static_dir: dist
  - name: backend
    build_command: pip install -r requirements.txt
    start_command: python server.py
    port: 5000
    type: web